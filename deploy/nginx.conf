# 平台账号管理后台 - Nginx 配置示例（PHP-FPM）
# 需要改的地方：server_name、root、fastcgi_pass（按服务器上 PHP-FPM 的监听地址）
# fastcgi_pass：宝塔 PHP 8.2 是 unix:/tmp/php-cgi-82.sock；Ubuntu 自带的 php8.2-fpm 是 unix:/run/php/php8.2-fpm.sock
server {
    listen 80;
    server_name ops.example.com;

    # 只暴露 public 目录，.env、vendor、src 都在网站根目录之外
    root /www/ops/public;
    index index.php;
    charset utf-8;
    # 跳转用相对地址，放在负载均衡、HTTPS 代理后面也不会跳错端口或协议
    absolute_redirect off;
    client_max_body_size 10m;

    location = / {
        return 302 /admin/;
    }

    # 管理后台页面（web/ 打包后的静态文件），前端路由都回落到 index.html
    location /admin/ {
        try_files $uri /admin/index.html;
    }

    location /admin/assets/ {
        expires 30d;
        access_log off;
    }

    # 其余请求（/admin-api/*）都交给 index.php
    location / {
        try_files $uri /index.php$is_args$args;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_pass unix:/tmp/php-cgi-82.sock;
    }

    # 其他 .php 文件和隐藏文件一律不让访问
    location ~ \.php$ {
        return 404;
    }

    # .well-known 放行，申请 SSL 证书要用
    location ~ /\.(?!well-known) {
        deny all;
    }
}
